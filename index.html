<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BL1ZER.TECH</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        body {
            background-image: url('FONupdate.jpg?v=15');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .mobile-version, .desktop-version {
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Жорстке вимкнення будь-яких рухів, підсвічування та ефектів для неклікабельних девайсів */
        .device-item.disabled,
        .desk-device-item.disabled {
            opacity: 0.55 !important;
            filter: grayscale(80%) !important;
            cursor: default !important;
            transform: none !important;
            background-color: transparent !important;
            pointer-events: none;
        }

        .device-item.disabled:hover,
        .desk-device-item.disabled:hover {
            opacity: 0.55 !important;
            filter: grayscale(80%) !important;
            transform: none !important;
            background-color: transparent !important;
        }


        /* ==========================================
           МОБІЛЬНА ВЕРСІЯ
           ========================================== */
        @media (max-width: 768px) {
            .mobile-version {
                display: flex;
                flex-direction: column;
                width: 100%;
                max-width: 360px;
                gap: 10px;
                align-items: center;
            }

            .profile {
                display: flex;
                flex-direction: column;
                align-items: center;
                margin-bottom: 2px;
            }

            .avatar {
                width: 100px;
                height: 100px;
                border-radius: 50%;
                object-fit: cover;
                border: 2px solid #ffffff;
                box-shadow: 0 4px 15px rgba(0,0,0,0.5);
                margin-bottom: 8px;
            }

            .username {
                font-size: 1.15rem;
                font-weight: 900;
                color: #ffffff;
                text-transform: uppercase;
                letter-spacing: 1.5px;
                text-shadow: 0 2px 6px rgba(0,0,0,0.8);
            }

            .accordion {
                width: 100%;
                background-color: rgba(12, 12, 12, 0.92);
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 14px;
                overflow: hidden;
            }

            summary {
                list-style: none;
                padding: 12px 16px;
                font-size: 0.9rem;
                font-weight: 800;
                text-transform: uppercase;
                cursor: pointer;
                display: flex;
                justify-content: space-between;
                align-items: center;
                color: #ffffff;
            }

            summary::-webkit-details-marker {
                display: none;
            }

            summary::after {
                content: '∨';
                font-size: 1rem;
                font-weight: bold;
                transition: transform 0.2s ease;
            }

            details[open] summary::after {
                transform: rotate(180deg);
            }

            .content {
                padding: 10px 14px 14px 14px;
                background-color: rgba(5, 5, 5, 0.95);
                border-top: 1px solid rgba(255, 255, 255, 0.1);
            }

            .pc-container {
                display: flex;
                gap: 10px;
                align-items: center;
            }

            .pc-image {
                width: 95px;
                height: auto;
                border-radius: 6px;
                object-fit: contain;
            }

            .pc-specs {
                display: flex;
                flex-direction: column;
                width: 100%;
            }

            .spec-row {
                padding: 4px 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                font-size: 0.7rem;
                font-weight: 800;
                text-transform: uppercase;
                color: #dddddd;
            }

            .spec-row:last-child {
                border-bottom: none;
            }

            .device-list {
                display: flex;
                flex-direction: column;
            }

            .device-item {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                padding: 8px 6px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.06);
                text-decoration: none;
                color: #fff;
                border-radius: 6px;
            }

            .device-item:last-child {
                border-bottom: none;
            }

            .device-left {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .device-img {
                width: 36px;
                height: 36px;
                object-fit: contain;
                border-radius: 4px;
            }

            .device-name {
                font-size: 0.78rem;
                font-weight: 800;
                text-transform: uppercase;
                color: #ffffff;
            }

            .arrow-right {
                font-size: 1rem;
                font-weight: bold;
                color: #888888;
            }

            .socials {
                display: flex;
                gap: 10px;
                justify-content: center;
                width: 100%;
                margin-top: 4px;
            }

            .social-btn {
                width: 50px;
                height: 50px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                text-decoration: none;
                background-color: rgba(12, 12, 12, 0.9);
                border: 2px solid #ffffff;
                color: #ffffff;
                flex-shrink: 0;
            }

            .social-btn svg {
                width: 22px;
                height: 22px;
            }
        }


        /* ==========================================
           ДЕСКТОПНА ВЕРСІЯ (ПК)
           ========================================== */
        @media (min-width: 769px) {
            .desktop-version {
                display: flex;
                width: 100%;
                max-width: 980px;
                background-color: rgba(15, 15, 15, 0.8);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.25);
                border-radius: 24px;
                padding: 45px;
                gap: 50px;
                box-shadow: 0 15px 50px rgba(0,0,0,0.6);
                align-items: center;
                animation: fadeIn 0.4s ease-in-out;
            }

            .desk-left {
                width: 300px;
                display: flex;
                flex-direction: column;
                align-items: center;
                border-right: 1px solid rgba(255, 255, 255, 0.2);
                padding-right: 45px;
                text-align: center;
            }

            .desk-avatar {
                width: 150px;
                height: 150px;
                border-radius: 50%;
                object-fit: cover;
                border: 2px solid #ffffff;
                box-shadow: 0 4px 25px rgba(0,0,0,0.5);
                margin-bottom: 18px;
                transition: transform 0.3s ease;
            }

            .desk-avatar:hover {
                transform: scale(1.05);
            }

            .desk-username {
                font-size: 1.6rem;
                font-weight: 900;
                color: #ffffff;
                text-transform: uppercase;
                letter-spacing: 2px;
                margin-bottom: 25px;
                text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            }

            .desk-socials {
                display: flex;
                gap: 12px;
                justify-content: center;
                width: 100%;
            }

            .desk-social-btn {
                width: 52px;
                height: 52px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                text-decoration: none;
                background-color: rgba(18, 18, 18, 0.8);
                border: 2px solid #ffffff;
                color: #ffffff;
                transition: all 0.25s ease;
                flex-shrink: 0;
            }

            .desk-social-btn:hover {
                background-color: #ffffff;
                color: #000000;
                transform: scale(1.1);
                box-shadow: 0 0 20px rgba(255,255,255,0.4);
            }

            .desk-social-btn svg {
                width: 24px;
                height: 24px;
            }

            .desk-right {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 20px;
            }

            .desk-accordion {
                width: 100%;
                background-color: rgba(20, 20, 20, 0.8);
                border: 1px solid rgba(255, 255, 255, 0.25);
                border-radius: 16px;
                overflow: hidden;
                transition: border-color 0.3s ease;
                box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            }

            .desk-accordion:hover {
                border-color: rgba(255, 255, 255, 0.6);
            }

            .desk-summary {
                list-style: none;
                padding: 18px 24px;
                font-size: 1.1rem;
                font-weight: 800;
                text-transform: uppercase;
                cursor: pointer;
                display: flex;
                justify-content: space-between;
                align-items: center;
                color: #ffffff;
                letter-spacing: 1px;
            }

            .desk-summary::-webkit-details-marker {
                display: none;
            }

            .desk-summary::after {
                content: '∨';
                font-size: 1.2rem;
                font-weight: bold;
                transition: transform 0.3s ease;
            }

            .desk-accordion[open] .desk-summary::after {
                transform: rotate(180deg);
            }

            .desk-content {
                padding: 20px;
                background-color: rgba(10, 10, 10, 0.9);
                border-top: 1px solid rgba(255, 255, 255, 0.15);
            }

            .desk-device-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .desk-device-item {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                padding: 12px 14px;
                background-color: rgba(15, 15, 15, 0.85);
                border: 1px solid rgba(255, 255, 255, 0.15);
                text-decoration: none;
                color: #fff;
                border-radius: 10px;
                transition: all 0.2s ease;
            }

            .desk-device-item:hover {
                background-color: rgba(30, 30, 30, 0.95);
                border-color: #ffffff;
                transform: translateY(-2px);
            }

            .desk-device-left {
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .desk-device-img {
                width: 40px;
                height: 40px;
                object-fit: contain;
                border-radius: 4px;
            }

            .desk-device-name {
                font-size: 0.8rem;
                font-weight: 800;
                text-transform: uppercase;
                color: #ffffff;
            }

            .desk-pc-box {
                display: flex;
                gap: 24px;
                align-items: center;
            }

            .desk-pc-image {
                width: 150px;
                height: auto;
                object-fit: contain;
            }

            .desk-pc-specs {
                display: flex;
                flex-direction: column;
                width: 100%;
                gap: 8px;
            }

            .desk-spec-row {
                padding: 8px 12px;
                background-color: rgba(20, 20, 20, 0.85);
                border-radius: 6px;
                font-size: 0.85rem;
                font-weight: 800;
                text-transform: uppercase;
                color: #ffffff;
                border: 1px solid rgba(255, 255, 255, 0.15);
            }
        }
    </style>
</head>
