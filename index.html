<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BL1ZER.TECH</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #121212 url('FONupdate.jpg') no-repeat center center fixed;
            background-size: cover;
            image-rendering: -webkit-optimize-contrast;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 16px;
        }

        .container {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        /* Аватарка та нік */
        .profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 6px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }

        .username {
            font-size: 1.3rem;
            font-weight: 900;
            color: #ff3366;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        /* Сині блоки */
        .accordion {
            width: 100%;
            background-color: #0d419d;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        summary {
            list-style: none;
            padding: 16px 20px;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        summary::after {
            content: '∨';
            font-size: 1.1rem;
            font-weight: bold;
            transition: transform 0.2s ease;
        }

        details[open] summary::after {
            transform: rotate(180deg);
        }

        .content {
            padding: 12px 16px 16px 16px;
            background-color: #0a337e;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ПК Блок */
        .pc-container {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .pc-image {
            width: 110px;
            height: auto;
            border-radius: 6px;
            object-fit: contain;
        }

        .pc-specs {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .spec-row {
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .spec-row:last-child {
            border-bottom: none;
        }

        /* Девайси */
        .device-list {
            display: flex;
            flex-direction: column;
        }

        .device-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            text-decoration: none;
            color: #fff;
        }

        .device-item:last-child {
            border-bottom: none;
        }

        .device-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .device-img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            border-radius: 4px;
        }

        .device-name {
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        /* Стрілочка вправо */
        .arrow-right {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            transition: transform 0.2s ease;
            user-select: none;
        }

        .device-item.clickable:hover .arrow-right {
            transform: translateX(5px);
        }

        /* Соціальні мережі */
        .socials {
            display: flex;
            gap: 12px;
            justify-content: center;
            width: 100%;
            margin-top: 10px;
        }

        .social-btn {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .social-btn:hover {
            transform: scale(1.08);
        }

        .social-btn svg {
            width: 26px;
            height: 26px;
        }

        /* Стилі кнопок соцмереж */
        .social-btn.tg {
            background-color: #000000;
            border: 2px solid #ffffff;
            color: #ffffff;
        }

        .social-btn.tt {
            background-color: #ffffff;
            border: 2px solid #000000;
            color: #000000;
        }

        .social-btn.ig {

            color: #ffffff;
        }

        .social-btn.yt {
            background-color: #000000;
            border: 2px solid #ffffff;
            color: #ffffff;
        }

    </style>
</head>
