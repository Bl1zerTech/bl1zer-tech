<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BL1ZER.TECH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
        }

        body {
            background: #021024;
            background: linear-gradient(135deg, #021024 0%, #052659 50%, #09509e 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 12px;
            color: #ffffff;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        /* Профіль */
        .profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #000000;
            border: 3px solid #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 10px;
        }

        .profile-title {
            font-size: 22px;
            font-weight: 700;
            color: #ff3366;
            letter-spacing: 1.5px;
            text-shadow: 0 0 8px rgba(255, 51, 102, 0.6);
        }

        /* Акордеон */
        .accordion-item {
            width: 100%;
            background-color: #0b3c85;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }

        .accordion-header {
            width: 100%;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-size: 18px;
            user-select: none;
        }

        .accordion-header .arrow {
            width: 12px;
            height: 12px;
            border-right: 3px solid #ffffff;
            border-bottom: 3px solid #ffffff;
            transform: rotate(45deg);
            transition: transform 0.3s ease;
        }

        .accordion-item.active .arrow {
            transform: rotate(-135deg);
        }

        .accordion-content {
            display: none;
            background-color: #08306b;
            padding: 10px 16px 16px 16px;
        }

        .accordion-item.active .accordion-content {
            display: block;
        }

        /* Елементи списку */
        .device-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #0d47a1;
            text-decoration: none;
            color: #ffffff;
        }

        .device-row:last-child {
            border-bottom: none;
        }

        .device-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .device-icon-box {
            width: 45px;
            height: 35px;
            background: #021024;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            color: #00d2ff;
            border: 1px solid #0d47a1;
        }

        .device-name {
            font-size: 15px;
            font-weight: 600;
        }

        .small-arrow {
            width: 8px;
            height: 8px;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            transform: rotate(-45deg);
        }

        /* Блок ПК */
        .pc-container {
            display: flex;
            gap: 12px;
            align-items: center;
            padding-top: 6px;
        }

        .pc-icon-box {
            width: 100px;
            height: 110px;
            background: #021024;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid #00d2ff;
            color: #00d2ff;
            font-size: 12px;
        }

        .pc-specs {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .pc-spec-item {
            font-size: 13px;
            padding-bottom: 4px;
            border-bottom: 1px solid #0d47a1;
        }

        /* Соцмережі */
        .socials {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            width: 100%;
        }

        .social-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .social-btn:active {
            transform: scale(0.95);
        }

        .social-btn.tg { background: #0088cc; }
        .social-btn.tiktok { background: #000000; border: 2px solid #ffffff; }

        .social-btn svg {
            width: 28px;
            height: 28px;
            fill: #ffffff;
        }
    </style>
</head>

    <script>
        document.querySelectorAll('.accordion-header').forEach(header => {
